name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/lana-20/vibium-ci:latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug Chrome
        run: |
          echo "whoami: $(whoami), uid: $(id -u)"
          echo "HOME=$HOME"
          CHROME=$(find /root/.cache/vibium -name "chrome" -not -name "chromedriver" 2>/dev/null | head -1)
          echo "Chrome wrapper: $CHROME"
          ls -la "$CHROME" 2>/dev/null || echo "not found"
          echo "--- wrapper contents ---"
          cat "$CHROME" 2>/dev/null || echo "cannot read"
          echo "--- chrome.real stat ---"
          ls -la "${CHROME}.real" 2>/dev/null || echo "not found"
          echo "--- running chrome ---"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --version 2>&1 || echo "exit code: $?"
        env:
          HOME: /root

      - name: Start Vibium daemon
        run: vibium daemon start
        env:
          HOME: /root

      - name: Run tests
        run: npm run test:ci
        env:
          CI: true
          HOME: /root
          AUT_BASE_URL: ${{ vars.AUT_BASE_URL }}

      - name: Stop Vibium daemon
        if: always()
        run: vibium daemon stop
        env:
          HOME: /root
