name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libnspr4 libnss3

      - name: Install dependencies
        run: npm ci

      - name: Install Vibium
        run: npm install -g vibium

      - name: Start Vibium daemon
        run: vibium daemon start

      - name: Verify vibium binary
        run: |
          echo "=== @vibium packages ==="
          ls node_modules/@vibium/ 2>/dev/null || echo "(none)"
          echo "=== linux-x64 binary ==="
          ls node_modules/@vibium/linux-x64/bin/ 2>/dev/null || echo "(not found)"
          echo "=== chrome location ==="
          find node_modules/@vibium/linux-x64 -name "chrome" -o -name "chrome-linux" 2>/dev/null | head -5 || echo "(not found)"
          echo "=== vibium version ==="
          vibium version 2>&1 || echo "(daemon version failed)"

      - name: Run tests
        run: npm run test:ci
        env:
          CI: true
          VIBIUM_DEBUG: "1"
          AUT_BASE_URL: ${{ vars.AUT_BASE_URL }}

      - name: Stop Vibium daemon
        if: always()
        run: vibium daemon stop
